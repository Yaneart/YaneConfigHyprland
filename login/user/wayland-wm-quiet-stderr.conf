# Уводим stderr компоновщика в journal (по умолчанию inherit → /dev/console → tty1).
# Без этого баннер «Welcome to Hyprland!» + ASCII-логотип и строки start-hyprland
# печатались на голый VT1 поверх удержанного plymouth-splash (бело-зелёный код
# сверху-слева перед hyprlock). StandardOutput уже =journal в шаблоне.
# Откат: удалить этот файл + `systemctl --user daemon-reload`.
[Service]
StandardError=journal

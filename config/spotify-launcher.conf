# Конфиг spotify-launcher.
# Нативный Wayland вместо XWayland — заметно плавнее на Hyprland.
# Если Spotify перестанет открываться — убрать extra_arguments.
[spotify]
# remote-debugging-port: локальный CDP-порт — через него theme-apply вживляет
# новые matugen-цвета в работающий клиент без перезапуска (spotify-recolor).
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland", "--remote-debugging-port=9222"]

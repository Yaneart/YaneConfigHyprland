$font = JetBrainsMono Nerd Font
$wallpaper = $HOME/.config/background

# Цвета генерирует matugen под текущие обои (см. templates/hyprlock-colors.conf).
source = $HOME/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Приложите палец
        present_message = Сканирую...
        retry_delay = 250
    }
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.18
    vibrancy_darkness = 0.0
}

shape {
    monitor =
    size = 520, 220
    color = $panel
    rounding = 22
    border_size = 1
    border_color = $accent_soft
    position = 0, 18
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 92
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow
    position = 0, 124
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $muted
    font_size = 22
    font_family = $font
    position = 0, 62
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] whoami
    color = $accent
    font_size = 16
    font_family = $font
    position = 0, -16
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.24
    dots_center = true
    outer_color = $outline
    inner_color = $panel_soft
    font_color = $fg
    fade_on_empty = false
    placeholder_text = Password
    hide_input = false
    check_color = $accent
    fail_color = $error
    fail_text = Wrong password
    capslock_color = $error
    position = 0, -72
    halign = center
    valign = center
}

# ── General ─────────────────────────────────

[general]

framerate         = 60
autosens          = 1
overshoot         = 20
bars              = 0
bar_width         = 2
bar_spacing       = 1
bar_height        = 32
lower_cutoff_freq = 50
higher_cutoff_freq = 10000


# ── Input ────────────────────────────────────

[input]

method  = pulse
source  = auto


# ── Output ───────────────────────────────────

[output]

method          = ncurses
channels        = stereo
mono_option     = average
reverse         = 0
bit_format      = 16bit
ascii_max_range = 7
alacritty_sync  = 0


# ── Color ────────────────────────────────────

[color]

gradient         = 1
gradient_count   = 5
gradient_color_1 = '{{color2}}'
gradient_color_2 = '{{color3}}'
gradient_color_3 = '{{color4}}'
gradient_color_4 = '{{color5}}'
gradient_color_5 = '{{color6}}'


# ── Smoothing ────────────────────────────────

[smoothing]

integral        = 77
monstercat      = 1
waves           = 0
noise_reduction = 77


# ── EQ ───────────────────────────────────────

[eq]

1 = 1
2 = 1
3 = 1
4 = 1
5 = 1

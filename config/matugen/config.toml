[templates.pywalfox]
input_path  = "~/.config/matugen/templates/pywalfox-colors.json"
output_path = "~/.config/matugen/generated/pywalfox-colors.json"
post_hook   = '''
bash -c '
{
  if command -v pywalfox >/dev/null 2>&1; then
    mkdir -p "$HOME/.cache/wal"
    ln -nfs "$HOME/.config/matugen/generated/pywalfox-colors.json" "$HOME/.cache/wal/colors.json"
    pywalfox update
  fi
} >/dev/null 2>&1 </dev/null & disown
'
'''
# GTK apps

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'


[templates.cava]
input_path  = '~/.config/matugen/templates/cava.conf'
output_path = '~/.config/cava/config'


# Spotify (Spicetify) — recolor the client to match the wallpaper.
# Re-applies in the background only if spicetify is installed; if Spotify is
# open it reloads in place, otherwise the patched files wait for next launch.
# eww music popup colors
[templates.eww]
input_path  = '~/.config/matugen/templates/eww-colors.scss'
output_path = '~/.config/eww/colors.scss'
post_hook   = '''
bash -c '
{
  if command -v eww >/dev/null 2>&1 && eww ping >/dev/null 2>&1; then
    eww reload
  fi
} >/dev/null 2>&1 </dev/null & disown
'
'''

[templates.spicetify]
input_path  = '~/.config/matugen/templates/spicetify-color.ini'
output_path = '~/.config/spicetify/Themes/matugen/color.ini'
post_hook   = '''
bash -c '
{
  if command -v spicetify >/dev/null 2>&1; then
    if pgrep -x spotify >/dev/null 2>&1; then
      spicetify -q apply       # Spotify открыт -> перезагрузить с новой темой
    else
      spicetify -q -n apply    # Spotify закрыт -> только пропатчить, НЕ запускать
    fi
  fi
} >/dev/null 2>&1 </dev/null & disown
'
'''



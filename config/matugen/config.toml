# Палитра целиком выводится из обоев (scheme-content задаётся в theme-apply).
# Вшитые custom_colors (blue/red/yellow/success) удалены 2026-06-24: они
# навязывали фиксированные хью независимо от обоев — отсюда брались "фантомные"
# синий/красный на зелёных обоях. Семантические имена теперь либо мапятся на
# реальные роли matugen (в шаблонах), либо берутся из wallust (реальные цвета
# пикселей обоев). См. memory: project_palette_multicolor.

[config.wallpaper]
command = "hyprpaper"
set = false
arguments = ["img", "--transition-type", "center"]

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/modules/generated_colors.lua'

# hyprlock, obs, sddm, kitty перенесены на wallust 24.06.2026 (реальные цвета
# обоев). Post-actions (sddm-sync) перенесены в bin/theme-apply. kitty теперь
# подключает ~/.cache/wallust/colors-kitty.conf напрямую.

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors/colors-matugen.rasi'


[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'


# eww-дашборд (попап по клику на часы): SCSS-палитра + бесшовный reload
[templates.eww]
input_path  = '~/.config/matugen/templates/eww-colors.scss'
output_path = '~/.config/eww/colors.scss'
post_hook   = 'eww reload >/dev/null 2>&1 || true'


[templates.swaync]
input_path = '~/.config/matugen/templates/colors-swaync.css'
output_path = '~/.config/swaync/colors-swaync.css'


# btop и starship перенесены на wallust 24.06.2026 (реальные цвета обоев вместо
# выдуманных matugen-акцентов) — см. wallust.toml [templates] btop/hyprstarship.


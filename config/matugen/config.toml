# Firefox (pywalfox) перенесён на wallust 24.06.2026 — matugen-вывод был
# полу-битый (большинство color-слотов = пустые строки). Теперь полный
# pywal-формат с реальными цветами обоев генерит wallust прямо в
# ~/.cache/wal/colors.json. Post-action `pywalfox update` — в bin/theme-apply.
# [templates.pywalfox]
# input_path  = "~/.config/matugen/templates/pywalfox-colors.json"
# output_path = "~/.config/matugen/generated/pywalfox-colors.json"
# GTK apps, cava — перенесены на wallust 24.06.2026 (реальные цвета обоев).
# gsettings-toggle (перезагрузка GTK-темы) перенесён в bin/theme-apply.

# VSCode — палитра вживляется в settings.json как workbench.colorCustomizations
# поверх базовой темы. VSCode применяет изменения settings.json вживую, без
# перезапуска окна. Скрипт слияния правит только этот ключ, остальное не трогает.
[templates.vscode]
input_path  = '~/.config/matugen/templates/vscode-colors.json'
output_path = '~/.config/matugen/generated/vscode-colors.json'
post_hook   = 'python3 ~/.local/bin/vscode-matugen >/dev/null 2>&1 || true'


# Spotify (Spicetify) перенесён на wallust 24.06.2026 (реальные цвета обоев).
# Перекраска (spotify-recolor + spicetify refresh) перенесена в bin/theme-apply.


